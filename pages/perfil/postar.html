<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
    <link rel="stylesheet" href="../../css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
</head>
<body>
    <header class="header-g container-g">
        <a href="../../index.html">
            <img src="../../assets/dogs.svg" alt="Icone dogs">
        </a>
        <a  data-header-link class="link-header" href="../login.html">Login / Criar</a>
    </header>
    <main class="container-g">

        <div class="header-perfil">
            <h1 class="titulo-modal titulo-account">Poste Sua Foto</h1>
              <div class="menu-div">
                <div class="data-container-menu-mobile">

                    <div data-menu-mobile class="menu-mobile">
                        <div class="bar-menu"></div>
                        <div data-conteudo-menu-mobile class="conteudo-menu-mobile">
                    <ul>
                        <li>
                            <a href="./perfil.html">
                                <img src="../../assets/feed.svg" alt="">
                                <p>Minhas Fotos</p>
                            </a>
                        </li>
                           <li>
                            <a href="./estatisticas.html">
                                <img src="../../assets/estatisticas.svg" alt="">
                                <p>Estatísticas</p>
                            </a>
                        </li>
                        <li>
                            <a href="./postar.html">
                                <img src="../../assets/adicionar.svg" alt="">
                                <p>Postar Fotos</p>
                            </a>
                        </li>
                        <li >
                            <a data-logout href="">
                                <img src="../../assets/sair.svg" alt="">
                                <p>Sair</p>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
                </div>
                <ul class="menu-account">
                    <li>
                        <a href="./perfil.html">
                            <img src="../../assets/feed.svg" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="./estatisticas.html">
                            <img src="../../assets/estatisticas.svg" alt="">
                        </a>
                    </li>
                    <li  class="ativo-menu-account">
                        <a href="./postar.html">
                            <img src="../../assets/adicionar.svg" alt="">
                        </a>
                    </li>
                    <li >
                        <a data-logout href="">
                            <img src="../../assets/sair.svg" alt="">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="container-g conteudo postart-foto">
            <form data-form-publish-post class="formulario-login"  method="post">
                <label for="nome">Nome</label>
                <input data-input-post type="text" id="nome" name="nome">
                <span data-erro-post-span></span>
                <label for="peso">Peso</label>
                <input data-input-post type="text" id="peso" name="peso">
                <span data-erro-post-span></span>
                <label for="idade">Idade</label>
                <input data-input-post type="text" id="idade" name="idade">
                <span data-erro-post-span></span>
                <input data-file data-input-post type="file" name="src" id="file">
                <span data-erro-post-span></span>
                
                <button class="btn-cadastro">publicar</button>
            </form>
            <img src="" data-preview class="div-preview"/>
        </div>
    </main>
    <script type="module" src="../../dist/script.js"></script>
</body>
</html>
